# Зміна 003 — друга партія каталогу: підліткова лінійка і два «тінейджерські» розміри.
#
# Окремий changeSet, а НЕ правка 002 — принципово. Liquibase тримає контрольну суму
# (checksum) кожного застосованого changeSet; якщо змінити вже застосований файл, при
# наступному старті він побачить розбіжність і зупинить застосунок. Правило просте:
# застосоване не редагують, додають нове.
#
# Ці шість позицій прийшли від постачальника БЕЗ фотографій, тому image_url тут не
# заповнюється взагалі — фото довантажує окрема міграція даних 005.
databaseChangeLog:
  - changeSet:
      id: 003-seed-more-bikes
      author: bidziura
      changes:
        - insert:
            tableName: bikes
            columns:
