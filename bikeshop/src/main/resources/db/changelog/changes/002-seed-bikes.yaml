# Зміна 002 — стартовий каталог велосипедів (20 позицій).
#
# До ПЗ 2/3 каталог наповнював BikeSeeder у коді. Тепер стартові дані теж під версіями:
# їх вставляє міграція, тому на будь-якій чистій базі каталог з'являється сам, без
# запуску якогось компонента застосунку.
#
# id задано явно (1..20) — інакше рядкам галереї (bike_images) не було б на що
# посилатися через bike_id. У PostgreSQL id — стовпець-ідентичність, тому явні значення
# дозволені, АЛЕ внутрішній лічильник від них не зсувається: наприкінці changeSet його
# пересуваємо вручну, інакше перший велосипед, доданий через POST, отримав би id=1 і
# впав на порушенні унікальності первинного ключа.
#
# 20 записів узято не випадково: розмір сторінки за замовчуванням — 20, тож із цією
# міграцією і наступною (ще 6) пагінація дає кілька сторінок навіть на типових розмірах.
