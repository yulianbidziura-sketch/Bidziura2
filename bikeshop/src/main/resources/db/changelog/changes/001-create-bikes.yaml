# Зміна 001 — створення таблиць каталогу.
#
# Схема мусить точно відповідати сутності Bike, бо Hibernate працює в режимі
# ddl-auto=validate: він нічого не створює, лише звіряє наявні таблиці з анотаціями.
# Розбіжність в імені чи типі колонки — і застосунок не стартує. Відповідність:
#   bikes        -> @Entity @Table(name = "bikes")
#   bike_images  -> @ElementCollection @CollectionTable(name = "bike_images")
databaseChangeLog:
  - changeSet:
      id: 001-create-bikes
      author: bidziura
      changes:
        # --- Каталог велосипедів ---
        - createTable:
            tableName: bikes
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true        # у PostgreSQL -> GENERATED BY DEFAULT AS IDENTITY
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: model
                  type: varchar(255)
                  constraints:
                    nullable: false          # @Column(nullable = false)
              - column:
                  name: brand
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: numeric(19, 2)       # BigDecimal -> numeric
                  constraints:
                    nullable: false
              - column:
                  name: frame_material
                  type: varchar(255)
              - column:
                  name: frame_size
                  type: varchar(16)
              - column:
                  name: wheel_size
                  type: numeric(4, 1)        # діаметр коліс у дюймах, напр. 27.5
              - column:
                  name: gears
                  type: integer
              - column:
                  name: weight_kg
                  type: numeric(5, 2)
              - column:
                  name: model_year           # не year: YEAR — слово зі словника SQL
                  type: integer
              - column:
                  name: image_url
                  type: varchar(500)
              - column:
                  name: description
                  type: varchar(2000)        # @Column(length = 2000)
              - column:
                  name: in_stock
                  type: integer
              - column:
                  name: color
                  type: varchar(255)

        # --- Галерея фото: колекція значень велосипеда ---
        - createTable:
            tableName: bike_images
            columns:
              - column:
                  name: bike_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: varchar(500)
              - column:
                  name: position             # @OrderColumn — тримає порядок фото в галереї
                  type: integer
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_bike_images_bike
            baseTableName: bike_images
            baseColumnNames: bike_id
            referencedTableName: bikes
            referencedColumnNames: id
