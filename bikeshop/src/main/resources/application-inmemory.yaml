# Профіль "inmemory" — старе сховище в пам'яті (Модуль 1), лишене для демонстрації DIP.
#
# Запуск:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=inmemory
#          (або java -jar ... --spring.profiles.active=inmemory)
#
# Під цим профілем базa даних не потрібна взагалі, тому автоконфігурацію JPA, джерела
# даних і Liquibase вимкнено. Активними стають InMemoryBikeRepository і BikeSeeder,
# а JPA-адаптер — ні. Жоден клас сервісу чи контролера при цьому не змінюється:
# вони залежать від інтерфейсу BikeRepository, а не від реалізації.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration
